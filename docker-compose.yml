services:
  avatar-app:
    build: .
    image: avatar-app:latest
    restart: unless-stopped
    ports:
      - "5580:5580"
    env_file:
      - .env
    volumes:
      - frames-cache:/app/cache/frames
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5580/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  frames-cache:
